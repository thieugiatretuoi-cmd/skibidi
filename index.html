<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐĂNG NHẬP</title>
    <script src="./main.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <h1>ĐĂNG NHẬP</h1>
        <form id="loginForm">
        
            <label for="username">Tên đăng nhập:</label>
            <br>
            <input type="text" id="username" placeholder="Nhập tên đăng nhập" name="username" required>
            <br>
            <br>
            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu" name="password" required>
            <button onclick="login()" class="button">Đăng nhập</button>
            <button onclick="changeColor()" class="button">chuyển màu background</button>
            <p id="message"></p>
        </form>
    </div>
</body>
</html>
